<title>Grandeza — Social Share Card (1200×630)</title>
<meta name="description" content="Render target for Grandeza's Open Graph / social share image. Screenshot the .card at 1200×630 and export as og-default.jpg.">
<style>
  /* ============================================================
     GRANDEZA — OG / social share card render target.
     Fixed 1200×630. Render this element to og-default.jpg for
     production (html-to-image, Playwright screenshot, or Satori).
     Background photo: Higgsfield · Nano Banana 2.
     ============================================================ */
  :root{
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    --brass:#c6a15b;--brass-2:#e0c079;--ink:#0b1517;--pass:#5ec489;
    --img-og:url("/img/og-default.jpg");
  }
  *{box-sizing:border-box;margin:0}
  body{background:#20262a;display:grid;place-items:center;min-height:100vh;padding:24px;
    font-family:var(--font-body);gap:16px}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;isolation:isolate;
    background:#0d1c1a;color:#fbf7ef;flex-shrink:0}
  .card .bg{position:absolute;inset:0;z-index:-2;background-image:var(--img-og);
    background-size:cover;background-position:center right;background-color:#0d1c1a}
  .card .veil{position:absolute;inset:0;z-index:-1;
    background:linear-gradient(90deg,rgba(7,15,16,.96) 0%,rgba(7,15,16,.86) 42%,rgba(7,15,16,.4) 100%)}
  .inner{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .row{display:flex;align-items:center;gap:16px}
  .seal{width:52px;height:52px}
  .brand{font-family:var(--font-display);font-size:38px;font-weight:600;letter-spacing:-.01em}
  .kicker{font-family:var(--font-mono);font-size:19px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--brass);display:flex;align-items:center;gap:14px}
  .kicker::before{content:"";width:44px;height:2px;background:currentColor;opacity:.7}
  h1{font-family:var(--font-display);font-size:70px;line-height:1.04;font-weight:600;letter-spacing:-.015em;
    max-width:15ch;margin-top:20px}
  h1 em{font-style:normal;color:var(--brass-2)}
  .foot{display:flex;align-items:center;gap:26px;font-family:var(--font-mono);font-size:20px;color:#c9d6d1}
  .foot .chip{display:flex;align-items:center;gap:9px}
  .foot .dot{width:9px;height:9px;border-radius:50%;background:var(--pass)}
  .foot .url{margin-left:auto;color:var(--brass);font-weight:600}
  .note{font-family:var(--font-mono);font-size:13px;color:#9fb3ad;text-align:center;max-width:1200px}
</style>
<div class="card" id="ogcard">
  <div class="bg"></div><div class="veil"></div>
  <div class="inner">
    <div class="row">
      <svg class="seal" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--brass-2)"/><stop offset="1" stop-color="var(--brass)"/></linearGradient></defs>
        <path fill="url(#sg)" d="M20 1.5l4.6 3.3 5.6-.5 2.1 5.2 4.6 3.3-1.6 5.4 1.6 5.4-4.6 3.3-2.1 5.2-5.6-.5L20 38.5l-4.6-3.3-5.6.5-2.1-5.2-4.6-3.3L4.7 21.7 3.1 16.3l4.6-3.3 2.1-5.2 5.6.5z"/>
        <path fill="none" stroke="#20180a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M13.5 20.2l4.4 4.3 8.6-9"/>
      </svg>
      <span class="brand">Grandeza</span>
    </div>
    <div>
      <div class="kicker">TCPA compliance · HVAC &amp; plumbing</div>
      <h1>Every text your shop sends is <em>evidence.</em></h1>
    </div>
    <div class="foot">
      <span class="chip"><span class="dot"></span>Free 12-minute risk scan</span>
      <span class="chip"><span class="dot"></span>Insurance-ready proof</span>
      <span class="url">grandeza.io</span>
    </div>
  </div>
</div>
<p class="note">Render target · export #ogcard at 1200×630 → og-default.jpg (see docs/social-assets.md)</p>
