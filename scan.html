<style>
  :root{
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"SF Mono","JetBrains Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
    --step--1:clamp(.78rem,.75rem + .15vw,.86rem);
    --step-0:clamp(1rem,.97rem + .2vw,1.09rem);
    --step-1:clamp(1.18rem,1.1rem + .4vw,1.4rem);
    --step-2:clamp(1.5rem,1.35rem + .7vw,2rem);
    --step-3:clamp(1.9rem,1.6rem + 1.3vw,2.7rem);
    --maxw:820px;--radius:14px;--radius-sm:10px;--ease:cubic-bezier(.22,.61,.36,1);
    --brass-bright:#c6a15b;--fail:#c4463a;--warn:#d68a2e;--pass:#2f8f5b;--panel-dark:#0b1517;
  }
  :root{
    --bg:#e9edec;--bg-tint:#e0e6e4;--surface:#f5f7f6;--surface-2:#fff;
    --ink:#0c1618;--ink-soft:#42544f;--ink-faint:#6b7d78;
    --line:rgba(12,22,24,.12);--line-strong:rgba(12,22,24,.22);
    --accent:#8a6a2e;--seal-1:#b78f3f;--seal-2:#e0c079;--link:#2e6e6a;
    --shadow:0 1px 2px rgba(12,22,24,.06),0 12px 34px -18px rgba(12,22,24,.28);
    --shadow-lift:0 2px 6px rgba(12,22,24,.08),0 26px 60px -22px rgba(12,22,24,.4);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0a1315;--bg-tint:#0d191b;--surface:#10201f;--surface-2:#152826;
    --ink:#e9efec;--ink-soft:#a7bcb6;--ink-faint:#7d938d;
    --line:rgba(198,161,91,.16);--line-strong:rgba(198,161,91,.32);
    --accent:#c9a45e;--seal-1:#c6a15b;--seal-2:#8a6a2e;--link:#5aa9a2;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 44px -20px rgba(0,0,0,.7);
    --shadow-lift:0 2px 8px rgba(0,0,0,.5),0 32px 70px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }}
  :root[data-theme="light"]{
    --bg:#e9edec;--bg-tint:#e0e6e4;--surface:#f5f7f6;--surface-2:#fff;
    --ink:#0c1618;--ink-soft:#42544f;--ink-faint:#6b7d78;
    --line:rgba(12,22,24,.12);--line-strong:rgba(12,22,24,.22);
    --accent:#8a6a2e;--seal-1:#b78f3f;--seal-2:#e0c079;--link:#2e6e6a;
    --shadow:0 1px 2px rgba(12,22,24,.06),0 12px 34px -18px rgba(12,22,24,.28);
    --shadow-lift:0 2px 6px rgba(12,22,24,.08),0 26px 60px -22px rgba(12,22,24,.4);color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0a1315;--bg-tint:#0d191b;--surface:#10201f;--surface-2:#152826;
    --ink:#e9efec;--ink-soft:#a7bcb6;--ink-faint:#7d938d;
    --line:rgba(198,161,91,.16);--line-strong:rgba(198,161,91,.32);
    --accent:#c9a45e;--seal-1:#c6a15b;--seal-2:#8a6a2e;--link:#5aa9a2;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 44px -20px rgba(0,0,0,.7);
    --shadow-lift:0 2px 8px rgba(0,0,0,.5),0 32px 70px -24px rgba(0,0,0,.8);color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  body{margin:0;min-height:100vh;background:
      radial-gradient(120% 80% at 80% -10%,color-mix(in srgb,var(--brass-bright) 12%,transparent),transparent 55%),
      var(--bg);
    color:var(--ink);font-family:var(--font-body);font-size:var(--step-0);line-height:1.6;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
  p{margin:0}
  a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px}
  .mono{font-family:var(--font-mono)}.tnum{font-variant-numeric:tabular-nums}

  header{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);
    backdrop-filter:blur(10px)}
  .nav{max-width:1100px;margin-inline:auto;height:62px;display:flex;align-items:center;gap:1rem;
    padding-inline:clamp(1.1rem,4vw,2rem)}
  .brand{display:flex;align-items:center;gap:.55rem;font-family:var(--font-display);font-size:1.26rem;
    font-weight:600;color:var(--ink)}
  .brand:hover{text-decoration:none}
  .seal{width:28px;height:28px}
  .nav .back{margin-left:auto;font-size:.9rem;color:var(--ink-soft)}
  .icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);
    background:transparent;color:var(--ink-soft);cursor:pointer;transition:.2s}
  .icon-btn:hover{border-color:var(--line-strong);color:var(--ink)}

  main{flex:1;display:flex;align-items:flex-start;justify-content:center;
    padding:clamp(1.4rem,5vw,3.5rem) clamp(1.1rem,4vw,2rem)}
  .card{width:100%;max-width:var(--maxw);background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow-lift);overflow:hidden}
  .card-top{padding:1.1rem clamp(1.3rem,4vw,2.2rem);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:1rem}
  .card-top .eyebrow{font-family:var(--font-mono);font-size:var(--step--1);letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent)}
  .progress{margin-left:auto;font-family:var(--font-mono);font-size:.8rem;color:var(--ink-faint)}
  .bar{height:4px;background:var(--line);position:relative}
  .bar > i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--seal-1),var(--seal-2));
    transition:width .4s var(--ease)}
  .body{padding:clamp(1.6rem,5vw,2.8rem)}

  .q-kicker{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-faint)}
  .q h2{font-size:var(--step-2);margin:.5rem 0 .4rem}
  .q .hint{color:var(--ink-soft);font-size:.95rem;margin-bottom:1.5rem}
  .opts{display:grid;gap:.7rem}
  .opt{display:flex;align-items:center;gap:.9rem;padding:1rem 1.15rem;border:1px solid var(--line);
    border-radius:var(--radius-sm);background:var(--surface-2);cursor:pointer;transition:border-color .18s,transform .18s var(--ease),background .18s;text-align:left;width:100%;font:inherit;color:inherit}
  .opt:hover{border-color:var(--accent);transform:translateY(-2px)}
  .opt .mk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);flex-shrink:0;
    display:grid;place-items:center;transition:.18s}
  .opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface-2))}
  .opt.sel .mk{border-color:var(--accent);background:var(--accent)}
  .opt.sel .mk svg{opacity:1}
  .opt .mk svg{opacity:0;color:#fff;transition:.18s}
  .opt .lab{font-weight:500}
  .opt .sub{display:block;color:var(--ink-faint);font-size:.85rem;font-weight:400;margin-top:.1rem}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1.8rem;gap:1rem}
  .btn{display:inline-flex;align-items:center;gap:.5em;font-family:var(--font-body);font-weight:600;
    font-size:.97rem;padding:.72em 1.3em;border-radius:11px;border:1px solid transparent;cursor:pointer;
    transition:transform .18s var(--ease),box-shadow .2s,border-color .2s,opacity .2s;text-decoration:none}
  .btn:hover{text-decoration:none}
  .btn-primary{background:linear-gradient(180deg,var(--seal-2),var(--seal-1));color:#20180a;box-shadow:var(--shadow)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-text{background:transparent;color:var(--ink-soft);border:none;padding-left:0}
  .btn-text:hover{color:var(--ink)}
  .btn .arrow{transition:transform .2s var(--ease)}.btn:hover:not(:disabled) .arrow{transform:translateX(3px)}

  /* form fields (lead capture) */
  .field{display:grid;gap:.4rem;margin-bottom:1.1rem}
  .field label{font-weight:600;font-size:.92rem}
  .field input{font:inherit;padding:.8em .95em;border-radius:var(--radius-sm);border:1px solid var(--line-strong);
    background:var(--surface-2);color:var(--ink)}
  .field input:focus{outline:2.5px solid var(--accent);outline-offset:1px;border-color:transparent}
  .consent{display:flex;gap:.6rem;align-items:flex-start;font-size:.85rem;color:var(--ink-soft);margin-bottom:1.3rem}
  .consent input{margin-top:.2rem}

  /* result */
  .result{text-align:center;display:none}
  .result.show{display:block}
  .gauge-wrap{position:relative;display:grid;place-items:center;margin:.5rem auto 0}
  .gauge-svg{width:min(300px,74vw);height:auto}
  .gauge-center{position:absolute;top:52%;left:50%;transform:translate(-50%,-50%)}
  .gauge-num{font-family:var(--font-mono);font-weight:600;font-size:clamp(3rem,12vw,4.2rem);line-height:1;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .gauge-max{font-family:var(--font-mono);font-size:1rem;color:var(--ink-faint)}
  .gauge-band{font-family:var(--font-mono);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;
    font-weight:600;margin-top:.3rem}
  .result h2{font-size:var(--step-3);margin:1.3rem 0 .5rem}
  .result .rlead{color:var(--ink-soft);max-width:48ch;margin:0 auto 1.6rem}
  .exposures{display:grid;gap:.6rem;text-align:left;max-width:460px;margin:0 auto 1.8rem}
  .exp{display:flex;gap:.8rem;align-items:flex-start;padding:.85rem 1rem;border:1px solid var(--line);
    border-radius:var(--radius-sm);background:var(--surface-2)}
  .exp .sev{font-family:var(--font-mono);font-size:.68rem;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;padding:.2em .5em;border-radius:5px;flex-shrink:0;margin-top:.1em}
  .exp .sev.fail{background:color-mix(in srgb,var(--fail) 18%,transparent);color:var(--fail)}
  .exp .sev.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
  .exp b{font-size:.94rem}.exp p{color:var(--ink-soft);font-size:.85rem;margin-top:.15rem}
  .disclaimer{color:var(--ink-faint);font-size:.78rem;max-width:60ch;margin:1.6rem auto 0;line-height:1.6}
  .step{display:none}.step.active{display:block;animation:fade .4s var(--ease)}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>

        <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--seal-2)"/><stop offset="1" stop-color="var(--seal-1)"/></linearGradient></defs>
        <path fill="url(#sg)" d="M20 1.5l4.6 3.3 5.6-.5 2.1 5.2 4.6 3.3-1.6 5.4 1.6 5.4-4.6 3.3-2.1 5.2-5.6-.5L20 38.5l-4.6-3.3-5.6.5-2.1-5.2-4.6-3.3L4.7 21.7 3.1 16.3l4.6-3.3 2.1-5.2 5.6.5z"/>

<main>
  <form class="card" id="scanForm" novalidate>
    <div class="card-top">
      <span class="eyebrow">Free Grandeza Score</span>
      <span class="progress" id="progress">Question 1 / 8</span>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="body" id="body"><!-- steps injected --></div>
  </form>
</main>

<script>
(function(){
  "use strict";
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  var root=document.documentElement,tbtn=document.getElementById("theme");
  tbtn.addEventListener("click",function(){
    var cur=root.getAttribute("data-theme");
    if(!cur){cur=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";}
    root.setAttribute("data-theme",cur==="dark"?"light":"dark");
  });

  /* --- Questionnaire: each answer carries a weighted score contribution --- */
  /* Max possible = 100. Weights reflect real TCPA risk priority from the 16-control model. */
  var questions=[
    {c:"CTRL-01 · Consent",q:"Do you store signed proof that each customer opted in to texts?",hint:"A screenshot of a thread doesn't count under the TCPA.",w:20,
      opts:[["Yes — signed & timestamped",1],["Sometimes / only at intake",0.5],["No, we assume opt-in",0]]},
    {c:"CTRL-04 · Do-Not-Call",q:"Do you screen numbers against the DNC registry before sending?",hint:"Professional plaintiffs seed DNC numbers to catch you.",w:16,
      opts:[["Yes, every send",1],["Occasionally",0.4],["Never",0]]},
    {c:"CTRL-02 · Audit trail",q:"Can you pull a customer's full message history in under a minute?",hint:"Or is it scattered across Twilio, CRM and email?",w:15,
      opts:[["Yes, one searchable log",1],["Eventually, across tools",0.4],["No",0]]},
    {c:"CTRL-03 · Rate limiting",q:"Do you cap how many messages a customer can get per day?",hint:"Multiple systems can stack texts on one person.",w:10,
      opts:[["Yes, by message type",1],["A rough limit",0.5],["No limits",0]]},
    {c:"CTRL-09 · Encryption",q:"Is customer message & call data encrypted at rest?",hint:"",w:10,
      opts:[["Yes",1],["Not sure",0.3],["No",0]]},
    {c:"CTRL-14 · Incident response",q:"Do you have a written plan for a TCPA complaint?",hint:"The day the demand letter lands is the wrong time to start.",w:12,
      opts:[["Yes, documented",1],["Informal / in my head",0.35],["No plan",0]]},
    {c:"CTRL-05 · Retention",q:"Do you have a defined data-retention & deletion policy?",hint:"",w:9,
      opts:[["Yes, enforced",1],["Exists on paper",0.4],["No",0]]},
    {c:"Volume","c2":true,q:"Roughly how many automated messages go out monthly?",hint:"Higher volume multiplies exposure per gap.",w:8,
      opts:[["Under 500",1],["500–5,000",0.6],["5,000+",0.3]]}
  ];

  var answers=new Array(questions.length).fill(null);
  var idx=0;
  var body=document.getElementById("body");
  var progress=document.getElementById("progress");
  var barfill=document.getElementById("barfill");
  var TOTAL=questions.length;

  function computeScore(){
    var sum=0,maxW=0;
    questions.forEach(function(q,i){ maxW+=q.w; if(answers[i]!=null) sum+=q.w*answers[i]; });
    return Math.round((sum/maxW)*100);
  }
  function band(s){
    if(s<34)return["Critical","var(--fail)"];
    if(s<=50)return["High Risk","var(--fail)"];
    if(s<=65)return["At Risk","var(--warn)"];
    if(s<=80)return["Moderate","var(--warn)"];
    return["Protected","var(--pass)"];
  }

  function renderQuestion(){
    var q=questions[idx];
    progress.textContent="Question "+(idx+1)+" / "+TOTAL;
    barfill.style.width=((idx)/(TOTAL))*100+"%";
    var html='<div class="q step active"><div class="q-kicker">'+(q.c||"")+'</div>'+
      '<h2>'+q.q+'</h2>'+(q.hint?'<p class="hint">'+q.hint+'</p>':'<div style="height:.6rem"></div>')+
      '<div class="opts" role="group">';
    q.opts.forEach(function(o,oi){
      var sel=answers[idx]===o[1]?' sel':'';
      html+='<button type="button" class="opt'+sel+'" data-v="'+o[1]+'" data-oi="'+oi+'">'+
        '<span class="mk"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="M5 12l4 4 10-11"/></svg></span>'+
        '<span class="lab">'+o[0]+'</span></button>';
    });
    html+='</div><div class="nav-row">'+
      (idx>0?'<button type="button" class="btn btn-text" id="back">← Back</button>':'<span></span>')+
      '<button type="button" class="btn btn-primary" id="next" '+(answers[idx]==null?'disabled':'')+'>'+
      (idx===TOTAL-1?'See my score':'Next')+' <span class="arrow" aria-hidden="true">→</span></button>'+
      '</div></div>';
    body.innerHTML=html;
    body.querySelectorAll(".opt").forEach(function(btn){
      btn.addEventListener("click",function(){
        answers[idx]=parseFloat(btn.dataset.v);
        body.querySelectorAll(".opt").forEach(function(b){b.classList.remove("sel");});
        btn.classList.add("sel");
        document.getElementById("next").disabled=false;
      });
    });
    if(idx>0)document.getElementById("back").addEventListener("click",function(){idx--;renderQuestion();});
    document.getElementById("next").addEventListener("click",function(){
      if(answers[idx]==null)return;
      if(idx<TOTAL-1){idx++;renderQuestion();}else{renderLead();}
    });
  }

  /* --- Lead capture before revealing score (email gate = qualified lead) --- */
  function renderLead(){
    progress.textContent="Almost there";
    barfill.style.width="92%";
    body.innerHTML='<div class="q step active"><div class="q-kicker">Last step</div>'+
      '<h2>Where should we send your full report?</h2>'+
      '<p class="hint">Your score plus a control-by-control PDF and a fixed-scope quote. No card, no spam.</p>'+
      '<div class="field"><label for="nm">Your name</label><input id="nm" name="name" autocomplete="name" placeholder="Jordan Alvarez"></div>'+
      '<div class="field"><label for="co">Company</label><input id="co" name="company" autocomplete="organization" placeholder="Alvarez Heating & Air"></div>'+
      '<div class="field"><label for="em">Work email</label><input id="em" name="email" type="email" autocomplete="email" placeholder="you@yourshop.com"></div>'+
      '<label class="consent"><input type="checkbox" id="cons"> I agree to receive my report and occasional compliance tips. I can opt out anytime.</label>'+
      '<div class="nav-row"><button type="button" class="btn btn-text" id="back">← Back</button>'+
      '<button type="button" class="btn btn-primary" id="reveal" disabled>Reveal my Grandeza Score <span class="arrow" aria-hidden="true">→</span></button></div></div>';
    var em=document.getElementById("em"),cons=document.getElementById("cons"),reveal=document.getElementById("reveal");
    function validate(){
      var ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.value)&&cons.checked;
      reveal.disabled=!ok;
    }
    em.addEventListener("input",validate);cons.addEventListener("change",validate);
    document.getElementById("back").addEventListener("click",function(){idx=TOTAL-1;renderQuestion();});
    reveal.addEventListener("click",function(){
      /* TODO(dev): POST lead + answers to your CRM / scoring endpoint here.
         Payload ready: { name, company, email, answers, score }. */
      submitLead({
        name:document.getElementById("nm").value,
        company:document.getElementById("co").value,
        email:em.value, answers:answers, score:computeScore()
      });
      renderResult();
    });
  }

  function submitLead(payload){
    // Placeholder: log for now. Wire to fetch('/api/scan', {method:'POST', body:JSON.stringify(payload)}).
    try{console.info("[Grandeza] lead ready to submit:",payload);}catch(e){}
  }

  var ARC=471.24;
  function renderResult(){
    var score=computeScore();var b=band(score);
    progress.textContent="Your result";barfill.style.width="100%";
    /* pick the lowest-scoring answered controls as top exposures */
    var gaps=questions.map(function(q,i){return {c:q.c||q.q,q:q.q,v:answers[i],w:q.w};})
      .filter(function(g){return g.v<1 && !( 'Volume'===g.c);})
      .sort(function(a,b2){return (a.v-b2.v)||(b2.w-a.w);}).slice(0,3);
    var expHtml=gaps.map(function(g){
      var sev=g.v===0?"fail":"warn";var lbl=g.v===0?"FAIL":"PARTIAL";
      return '<div class="exp"><span class="sev '+sev+'">'+lbl+'</span><div><b>'+g.c+'</b><p>'+g.q+'</p></div></div>';
    }).join("");
    body.innerHTML='<div class="result show"><div class="q-kicker" style="text-align:center">Grandeza Score™</div>'+
      '<div class="gauge-wrap"><svg class="gauge-svg" viewBox="0 0 260 210" role="img" aria-label="Your Grandeza compliance score">'+
      '<g transform="rotate(135 130 120)">'+
      '<circle cx="130" cy="120" r="100" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round" stroke-dasharray="471.24 628.32"/>'+
      '<circle id="gv" cx="130" cy="120" r="100" fill="none" stroke="var(--fail)" stroke-width="16" stroke-linecap="round" stroke-dasharray="471.24 628.32" stroke-dashoffset="471.24" style="transition:stroke-dashoffset 1.2s var(--ease),stroke .6s"/>'+
      '</g></svg><div class="gauge-center"><div class="gauge-num tnum"><span id="gn">0</span><span class="gauge-max">/100</span></div>'+
      '<div class="gauge-band" id="gb">—</div></div></div>'+
      '<h2>'+headline(score)+'</h2>'+
      '<p class="rlead">'+sub(score)+'</p>'+
      (expHtml?'<div class="exposures">'+expHtml+'</div>':'')+
      '<a class="btn btn-primary" href="landing.html#offer">Book my free hardening walkthrough <span class="arrow" aria-hidden="true">→</span></a>'+
      '<p class="disclaimer">This is a preliminary self-assessment for planning, not legal advice. A full scan verifies each control against your live setup. Grandeza is not a law firm.</p></div>';
    // animate gauge to score
    var gv=document.getElementById("gv"),gn=document.getElementById("gn"),gb=document.getElementById("gb");
    function paint(s){var bb=band(s);gv.style.strokeDashoffset=String(ARC*(1-s/100));gv.style.stroke=bb[1];
      gn.textContent=String(s);gb.textContent=bb[0];gb.style.color=bb[1];}
    if(reduce){paint(score);}else{
      var start=performance.now();
      (function f(now){var p=Math.min(1,(now-start)/1200);var e=1-Math.pow(1-p,3);
        paint(Math.round(score*e));if(p<1)requestAnimationFrame(f);})(start);
    }
  }
  function headline(s){if(s<=50)return"You're carrying real exposure.";if(s<=80)return"You're close — but there are gaps.";return"You're in strong shape.";}
  function sub(s){if(s<=50)return"Several controls would fail under scrutiny. The good news: these are exactly what a 4-week hardening engagement fixes — and your first walkthrough is free.";
    if(s<=80)return"You've done more than most shops. A focused hardening pass closes the remaining gaps and gets you a defensible binder.";
    return"Your intake is largely defensible. A verification scan confirms it and produces the binder your carrier will want on file.";}

  renderQuestion();
})();
</script>
