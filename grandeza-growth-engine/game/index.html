<title>Survive the Audit — The Grandeza Scan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="The 16-control Grandeza Scan as a 3-minute survival game. Sixteen threats. One question each. Can your AI intake stay Defensible?" />

<style>
  /* ============================================================
     SURVIVE THE AUDIT — the Grandeza Scan as a survival console
     Self-contained. No external requests (CSP-safe).
     ============================================================ */

  :root {
    /* brand */
    --navy:        #1F2A44;
    --navy-deep:   #131b2e;
    --gold:        #B8862B;
    --gold-bright: #E0A93A;

    /* semantic (kept separate from the gold accent) */
    --pass:   #3E9E7A;
    --pass-2: #57c79b;
    --warn:   #C8912F;
    --crit:   #D6483B;
    --crit-2: #ff6a5a;

    /* dark ground (navy-biased neutrals) */
    --bg:       #0e1424;
    --bg-2:     #141d33;
    --panel:    #18233d;
    --panel-2:  #1e2b49;
    --line:     #2b3a5e;
    --ink:      #eef2fb;
    --ink-dim:  #aeb9d4;
    --ink-mute: #74809e;

    --shadow: 0 24px 60px -20px rgba(0,0,0,.7);
    --radius: 18px;

    --display: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --body:    ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:    ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg:      #eef0f6;
      --bg-2:    #e4e8f2;
      --panel:   #ffffff;
      --panel-2: #f5f7fc;
      --line:    #d8deec;
      --ink:     #16203a;
      --ink-dim: #46536f;
      --ink-mute:#7a86a0;
      --navy-deep:#e9ecf5;
      --shadow: 0 24px 50px -24px rgba(31,42,68,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0e1424; --bg-2:#141d33; --panel:#18233d; --panel-2:#1e2b49; --line:#2b3a5e;
    --ink:#eef2fb; --ink-dim:#aeb9d4; --ink-mute:#74809e; --navy-deep:#131b2e;
    --shadow:0 24px 60px -20px rgba(0,0,0,.7);
  }
  :root[data-theme="light"] {
    --bg:#eef0f6; --bg-2:#e4e8f2; --panel:#ffffff; --panel-2:#f5f7fc; --line:#d8deec;
    --ink:#16203a; --ink-dim:#46536f; --ink-mute:#7a86a0; --navy-deep:#e9ecf5;
    --shadow:0 24px 50px -24px rgba(31,42,68,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--body);
    background:
      radial-gradient(1200px 700px at 78% -8%, rgba(184,134,43,.14), transparent 60%),
      radial-gradient(900px 620px at 10% 108%, rgba(214,72,59,.10), transparent 55%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    line-height: 1.5;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(14px, 3vw, 28px);
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
  }

  /* ---------- brand bar ---------- */
  .brand {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 14px;
  }
  .word {
    font-weight: 800; letter-spacing: .28em; font-size: 15px;
    color: var(--ink);
  }
  .word b { color: var(--gold-bright); font-weight: 800; }
  .theme-btn {
    font: inherit; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-dim); background: transparent; border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .theme-btn:hover { color: var(--ink); border-color: var(--gold); }

  /* ---------- HUD ---------- */
  .hud {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    gap: clamp(10px, 3vw, 20px);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 16px; margin-bottom: 14px;
  }
  .hud.hide { display: none; }
  .hud-cell .k { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-mute); }
  .hud-threat .v { font-family: var(--mono); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .meter-cell .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .meter-cell .band { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink-dim); }
  .meter-track { height: 9px; border-radius: 999px; background: rgba(120,140,180,.18); overflow: hidden; position: relative; }
  .meter-fill { height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--crit) 0%, var(--warn) 45%, var(--pass) 78%, var(--pass-2) 100%);
    transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .hud-liab { text-align: right; }
  .hud-liab .v { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--crit-2); font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: light) { .hud-liab .v { color: var(--crit); } }
  :root[data-theme="light"] .hud-liab .v { color: var(--crit); }

  /* ---------- shared card ---------- */
  .stage { flex: 1; display: flex; flex-direction: column; }
  .card {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: clamp(20px, 4.5vw, 34px);
    display: flex; flex-direction: column;
    animation: rise .45s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- intro ---------- */
  .eyebrow { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-bright); font-weight: 700; }
  h1 { font-family: var(--display); font-weight: 800; letter-spacing: -.02em; text-wrap: balance;
       font-size: clamp(30px, 7vw, 50px); line-height: 1.02; margin: 12px 0 0; }
  h1 .u { color: var(--gold-bright); }
  .lede { color: var(--ink-dim); font-size: clamp(15px, 2.4vw, 17px); max-width: 46ch; margin: 16px 0 0; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 4px; }
  .fact { font-size: 12.5px; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
  .fact b { color: var(--ink); }

  .btn {
    font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 12px;
    padding: 15px 22px; font-size: 16px; letter-spacing: .01em;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn:active { transform: translateY(1px) scale(.995); }
  .btn-primary {
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #241a06; box-shadow: 0 12px 28px -12px rgba(184,134,43,.75);
  }
  .btn-primary:hover { box-shadow: 0 16px 34px -12px rgba(184,134,43,.9); }
  .btn-ghost { background: transparent; color: var(--ink-dim); border: 1px solid var(--line); }
  .btn-ghost:hover { color: var(--ink); border-color: var(--gold); }
  .cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .mini { font-size: 12px; color: var(--ink-mute); margin-top: 16px; }

  /* ---------- scenario ---------- */
  .sc-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .pill { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700;
    padding: 5px 10px; border-radius: 999px; }
  .pill-code { font-family: var(--mono); background: rgba(184,134,43,.16); color: var(--gold-bright); border: 1px solid rgba(184,134,43,.4); }
  .pill-pillar { background: rgba(120,140,180,.14); color: var(--ink-dim); border: 1px solid var(--line); }
  .pill-flag { background: rgba(214,72,59,.16); color: var(--crit-2); border: 1px solid rgba(214,72,59,.5); }
  :root[data-theme="light"] .pill-flag, @media (prefers-color-scheme: light) { }
  .sc-name { font-family: var(--display); font-weight: 800; font-size: clamp(13px,2.2vw,15px); color: var(--ink-dim); letter-spacing: .01em; margin-left: auto; }

  .scene { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 3.6vw, 26px);
    line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; margin: 4px 0 6px; }
  .prompt { color: var(--gold-bright); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; margin: 14px 0 16px; }

  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    text-align: left; font: inherit; cursor: pointer; width: 100%;
    background: var(--navy-deep); color: var(--ink);
    border: 1px solid var(--line); border-radius: 13px;
    padding: 15px 16px 15px 52px; position: relative;
    transition: border-color .15s, background .15s, transform .1s;
  }
  @media (prefers-color-scheme: light) { .opt { background: var(--panel-2); } }
  :root[data-theme="light"] .opt { background: var(--panel-2); }
  .opt:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); }
  .opt:focus-visible { outline: 3px solid var(--gold-bright); outline-offset: 2px; }
  .opt .key {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    background: rgba(120,140,180,.16); color: var(--ink-dim); border: 1px solid var(--line);
  }
  .opt:disabled { cursor: default; opacity: .96; }
  .opt.is-pass  { border-color: var(--pass); background: rgba(62,158,122,.14); }
  .opt.is-partial { border-color: var(--warn); background: rgba(200,145,47,.14); }
  .opt.is-fail  { border-color: var(--crit); background: rgba(214,72,59,.15); }
  .opt.dim { opacity: .4; }
  .opt .tag { display: none; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; margin-top: 6px; }
  .opt.is-pass .tag { display: block; color: var(--pass-2); }
  .opt.is-partial .tag { display: block; color: var(--warn); }
  .opt.is-fail .tag { display: block; color: var(--crit-2); }

  /* verdict strip under a scenario */
  .verdict { margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 16px; display: none; }
  .verdict.show { display: block; animation: rise .35s ease; }
  .verdict .vk { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
  .verdict.pass .vk { color: var(--pass-2); }
  .verdict.partial .vk { color: var(--warn); }
  .verdict.fail .vk { color: var(--crit-2); }
  .verdict p { margin: 8px 0 0; color: var(--ink-dim); font-size: 14.5px; }
  .verdict .next-row { display: flex; justify-content: flex-end; margin-top: 16px; }

  /* progress dots */
  .dots { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(120,140,180,.25); border: 1px solid transparent; }
  .dot.pass { background: var(--pass); }
  .dot.partial { background: var(--warn); }
  .dot.fail { background: var(--crit); }
  .dot.autofail { box-shadow: 0 0 0 2px rgba(214,72,59,.5); }
  .dot.cur { background: var(--gold-bright); transform: scale(1.35); }

  /* ---------- red flag interstitial ---------- */
  .flash {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(circle at 50% 40%, rgba(120,20,14,.9), rgba(20,8,8,.96));
  }
  .flash.show { display: flex; animation: flashin .3s ease; }
  @keyframes flashin { from { opacity: 0; } to { opacity: 1; } }
  .flash-inner { max-width: 460px; text-align: center; }
  .flash .stamp {
    font-family: var(--display); font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: #ffd9d3; font-size: clamp(30px, 8vw, 52px); line-height: 1;
    border: 3px solid var(--crit-2); border-radius: 14px; padding: 14px 20px; display: inline-block;
    transform: rotate(-3deg); box-shadow: 0 0 40px rgba(255,80,64,.5);
  }
  .flash h2 { color: #fff; font-family: var(--display); font-size: 22px; margin: 26px 0 0; text-wrap: balance; }
  .flash p { color: #ffc9c1; margin: 12px 0 0; font-size: 15px; }
  .flash .btn { margin-top: 24px; }
  .flash .btn-primary { background: #fff; color: #7a1712; box-shadow: none; }

  /* screen shake */
  @keyframes shake {
    10%,90% { transform: translateX(-2px); } 20%,80% { transform: translateX(4px); }
    30%,50%,70% { transform: translateX(-8px); } 40%,60% { transform: translateX(8px); }
  }
  .shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97); }

  /* ---------- results ---------- */
  .result-top { display: flex; gap: clamp(16px,4vw,28px); align-items: center; flex-wrap: wrap; }
  .ring {
    --p: 0; --c: var(--gold);
    width: 132px; height: 132px; border-radius: 50%; flex: none;
    background: conic-gradient(var(--c) calc(var(--p)*1%), rgba(120,140,180,.16) 0);
    display: grid; place-items: center; position: relative;
  }
  .ring::after { content: ""; position: absolute; inset: 11px; border-radius: 50%; background: var(--panel); }
  .ring .num { position: relative; z-index: 1; font-family: var(--mono); font-weight: 700; font-size: 34px; font-variant-numeric: tabular-nums; }
  .ring .den { position: relative; z-index: 1; font-size: 12px; color: var(--ink-mute); }
  .verdict-band { flex: 1; min-width: 200px; }
  .verdict-band .eyebrow { color: var(--ink-mute); }
  .verdict-band .band-name { font-family: var(--display); font-weight: 800; font-size: clamp(28px,6vw,40px); line-height: 1; margin: 6px 0 0; }
  .verdict-band .band-desc { color: var(--ink-dim); margin: 10px 0 0; font-size: 15px; }

  .redbar {
    margin-top: 20px; border: 1px solid rgba(214,72,59,.5); background: rgba(214,72,59,.1);
    border-radius: 12px; padding: 14px 16px; display: none;
  }
  .redbar.show { display: block; }
  .redbar .rk { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--crit-2); }
  .redbar ul { margin: 10px 0 0; padding-left: 18px; color: var(--ink-dim); font-size: 14px; }
  .redbar li { margin: 4px 0; }

  .liab-line { margin-top: 18px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--navy-deep); }
  @media (prefers-color-scheme: light){ .liab-line { background: var(--panel-2); } }
  :root[data-theme="light"] .liab-line { background: var(--panel-2); }
  .liab-line .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); }
  .liab-line .v { font-family: var(--mono); font-weight: 700; font-size: clamp(24px,5vw,32px); color: var(--crit-2); font-variant-numeric: tabular-nums; }
  :root[data-theme="light"] .liab-line .v { color: var(--crit); }

  .pillars { margin-top: 22px; display: flex; flex-direction: column; gap: 11px; }
  .pillars h3, .weak h3 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-mute); margin: 0 0 4px; }
  .prow { display: grid; grid-template-columns: 120px 1fr 40px; align-items: center; gap: 10px; }
  .prow .pn { font-size: 13px; color: var(--ink-dim); }
  .prow .pt { height: 8px; border-radius: 999px; background: rgba(120,140,180,.16); overflow: hidden; }
  .prow .pf { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--gold-bright)); }
  .prow .pv { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

  .weak { margin-top: 22px; }
  .weak ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .weak li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--ink-dim); }
  .weak li .c { font-family: var(--mono); font-size: 11px; color: var(--gold-bright); border: 1px solid rgba(184,134,43,.4); border-radius: 6px; padding: 2px 6px; flex: none; }

  .disclaimer { font-size: 11.5px; color: var(--ink-mute); margin-top: 22px; line-height: 1.5; border-top: 1px solid var(--line); padding-top: 14px; }
  .disclaimer a { color: var(--gold-bright); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>

<div class="wrap">
  <div class="brand">
    <div class="word">GRANDEZA<b>.</b></div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle light or dark theme">Theme</button>
  </div>

  <div class="hud hide" id="hud" aria-hidden="true">
    <div class="hud-cell hud-threat">
      <div class="k">Threat</div>
      <div class="v"><span id="hThreat">01</span> / 16</div>
    </div>
    <div class="hud-cell meter-cell">
      <div class="top">
        <span class="k">Defensibility</span>
        <span class="band" id="hBand">—</span>
      </div>
      <div class="meter-track"><div class="meter-fill" id="hMeter"></div></div>
    </div>
    <div class="hud-cell hud-liab">
      <div class="k">Exposure</div>
      <div class="v" id="hLiab">$0</div>
    </div>
  </div>

  <div class="stage" id="stage" aria-live="polite"></div>
</div>

<div class="flash" id="flash" role="alertdialog" aria-modal="true" aria-labelledby="flashTitle">
  <div class="flash-inner">
    <div class="stamp">Red Flag</div>
    <h2 id="flashTitle"></h2>
    <p id="flashBody"></p>
    <button class="btn btn-primary" id="flashNext" type="button">Brace for the next one →</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* -------- theme toggle -------- */
  var root = document.documentElement;
  document.getElementById("themeBtn").addEventListener("click", function () {
    var cur = root.getAttribute("data-theme");
    if (!cur) cur = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });

  /* -------- scan spine (mirrors data/controls.json) -------- */
  var BANDS = [
    { min: 0,  max: 25,  label: "Critical",   desc: "Actively exposed on multiple heavy controls." },
    { min: 26, max: 50,  label: "Exposed",     desc: "Real liability is live. Most first-time shops land here." },
    { min: 51, max: 75,  label: "Developing",  desc: "A foundation exists, but real gaps remain." },
    { min: 76, max: 90,  label: "Defensible",  desc: "You would survive scrutiny with only minor fixes." },
    { min: 91, max: 100, label: "Protected",   desc: "The full evidence layer is in place." }
  ];
  function bandFor(score) {
    for (var i = 0; i < BANDS.length; i++) if (score >= BANDS[i].min && score <= BANDS[i].max) return BANDS[i];
    return BANDS[0];
  }

  /* -------- the 16 threats --------
     tiers per option: 'pass' (full weight), 'partial' (half), 'fail' (zero)
     exposure = illustrative liability added on fail; partial adds ~38%.
     Statutory figures inside consequence text are the verified ones only. */
  var THREATS = [
    { code:"01", name:"AI Identity Disclosure", pillar:"Disclosure", weight:8, autoFail:true, exposure:41000,
      scene:"A caller on your AI line asks point-blank: “Wait — am I talking to a real person?”",
      prompt:"What does your AI say?",
      opts:[
        {t:"pass",    label:"It says so up front: “You’re speaking with Grandeza’s AI assistant.”"},
        {t:"partial", label:"It only admits it’s AI if the caller keeps pushing."},
        {t:"fail",    label:"“Yes, this is Jamie from the office” — and it keeps going."}
      ],
      pass:"Clean. Disclosed before it mattered.",
      partial:"Grudging disclosure still reads as evasive to a regulator.",
      fail:"The FTC treats a bot posing as human as a deceptive practice (15 U.S.C. § 45), and a dozen states now mandate disclosure." },

    { code:"02", name:"Consent Language & NRS 603A", pillar:"Privacy", weight:7, autoFail:false, exposure:22000,
      scene:"Your intake form takes a name, phone, and address. A customer asks what you do with it.",
      prompt:"Your consent language says…",
      opts:[
        {t:"pass",    label:"Exactly what’s collected, why, and how long you keep it."},
        {t:"partial", label:"A generic “I agree to the terms” checkbox."},
        {t:"fail",    label:"Nothing — there’s no consent language at all."}
      ],
      pass:"That’s consent that actually holds up.",
      partial:"A borrowed checkbox isn’t consent to what you specifically collect.",
      fail:"NRS 603A treats that intake data as regulated the moment you collect it. Missing consent is the gap on nearly every first scan." },

    { code:"03", name:"TCPA Outbound Compliance", pillar:"Outbound", weight:9, autoFail:true, exposure:500000,
      scene:"Your CRM is about to text 1,000 leads a promo. Some came from a bought list.",
      prompt:"Before it sends, you…",
      opts:[
        {t:"pass",    label:"Confirm every number has logged written consent for YOUR business."},
        {t:"partial", label:"Assume the list vendor “handled consent” and send."},
        {t:"fail",    label:"Blast all 1,000 — consent isn’t something you track."}
      ],
      pass:"That’s the one thing that survives a challenge.",
      partial:"Resold, shared-lead consent is exactly what plaintiffs’ attorneys attack.",
      fail:"TCPA runs $500–$1,500 per text, and the class action has no cap. One blast to 1,000 thin-consent numbers is seven figures of exposure." },

    { code:"04", name:"Data Minimization", pillar:"Privacy", weight:6, autoFail:false, exposure:15000,
      scene:"Your AI intake captures 14 fields per call. Eight of them are never used again.",
      prompt:"Those eight extra fields are…",
      opts:[
        {t:"pass",    label:"Gone — you collect only what a job actually needs."},
        {t:"partial", label:"Still collected, but “we’ll clean it up eventually.”"},
        {t:"fail",    label:"All stored forever, just in case."}
      ],
      pass:"Smaller footprint, smaller breach.",
      partial:"“Eventually” is a breach waiting to be bigger than it had to be.",
      fail:"Every field you keep is a field you must secure and disclose. Less collected is less exposed when a breach hits." },

    { code:"05", name:"Third-Party Data Sharing", pillar:"Privacy", weight:6, autoFail:false, exposure:18000,
      scene:"A lawyer asks you to list every place a customer’s data travels after the call.",
      prompt:"You can…",
      opts:[
        {t:"pass",    label:"Name every hop — CRM, vendor, scheduler — each with a reason."},
        {t:"partial", label:"Name a couple and guess at the rest."},
        {t:"fail",    label:"Have no real idea where it all ends up."}
      ],
      pass:"If you can map it, you can defend it.",
      partial:"A partial map is the answer you don’t want to give twice.",
      fail:"Unmapped data-sharing is an answer you really don’t want to give under oath." },

    { code:"06", name:"Opt-Out Mechanism", pillar:"Privacy", weight:5, autoFail:false, exposure:45000,
      scene:"A customer texts STOP to your outbound number.",
      prompt:"What happens next?",
      opts:[
        {t:"pass",    label:"Texts stop instantly, and it’s logged."},
        {t:"partial", label:"It stops, but nobody’s sure it was recorded."},
        {t:"fail",    label:"The next campaign texts them anyway."}
      ],
      pass:"STOP that actually stops. Rare, and it matters.",
      partial:"If you can’t prove it stopped, you can’t prove you complied.",
      fail:"Every message after an ignored STOP is a fresh TCPA violation." },

    { code:"07", name:"Human Override & Escalation", pillar:"Guardrails", weight:7, autoFail:false, exposure:250000,
      scene:"A homeowner tells your AI: “I smell gas.”",
      prompt:"Your AI…",
      opts:[
        {t:"pass",    label:"Instantly escalates to a human and flags it urgent."},
        {t:"partial", label:"Books the soonest available slot and moves on."},
        {t:"fail",    label:"Offers Tuesday at 2 and asks about a reminder."}
      ],
      pass:"That’s the save. A human owns the emergency.",
      partial:"“Soonest slot” is still a machine deciding an emergency isn’t one.",
      fail:"No escalation path turns a safety emergency into a headline — and a lawsuit. This control can never fail." },

    { code:"08", name:"Employee AI Use Policy", pillar:"Governance", weight:5, autoFail:false, exposure:30000,
      scene:"A tech pastes a customer’s full info into a public chatbot to draft a reply.",
      prompt:"Your written policy on that is…",
      opts:[
        {t:"pass",    label:"Clear, signed, and staff are trained on exactly this."},
        {t:"partial", label:"Something you’ve “mentioned” but never wrote down."},
        {t:"fail",    label:"Nonexistent — nobody’s thought about it."}
      ],
      pass:"The human gap is closed.",
      partial:"A policy nobody signed is a policy nobody follows.",
      fail:"That paste is your data breach now. Without a written policy, it’s not an edge case — it’s a matter of time." },

    { code:"09", name:"Recording Consent & Disclosure", pillar:"Disclosure", weight:8, autoFail:true, exposure:5000,
      scene:"Your AI records every call for “quality.” A customer standing in Las Vegas was never told.",
      prompt:"In Nevada, that recording is…",
      opts:[
        {t:"pass",    label:"Consented and logged on every single call."},
        {t:"partial", label:"Disclosed in a policy nobody ever reads aloud."},
        {t:"fail",    label:"Silent — you record, you don’t ask."}
      ],
      pass:"All-party consent, on the record. Exactly right.",
      partial:"A written policy isn’t the same as consent given on the call.",
      fail:"Nevada is all-party consent (NRS 200.620). Recording without it is a category D felony — up to 4 years and $5,000 (NRS 193.130)." },

    { code:"10", name:"Accuracy & Scope Limits", pillar:"Guardrails", weight:6, autoFail:false, exposure:25000,
      scene:"Your AI confidently quotes a price you don’t offer and a warranty you don’t honor.",
      prompt:"Its scope limits are…",
      opts:[
        {t:"pass",    label:"Documented — it only speaks to what it’s approved to say."},
        {t:"partial", label:"Loosely defined; it improvises sometimes."},
        {t:"fail",    label:"Nonexistent — it answers anything, confidently."}
      ],
      pass:"Confident only where it’s allowed to be.",
      partial:"“Sometimes improvises” is a promise you’ll have to honor later.",
      fail:"A hallucinated quote is your liability, not the vendor’s. Confident-and-wrong is the costliest combination in AI intake." },

    { code:"11", name:"Vendor Contracts (DPA)", pillar:"Governance", weight:5, autoFail:false, exposure:40000,
      scene:"Your AI vendor gets breached. Their contract with you is…",
      prompt:"The signed DPA says…",
      opts:[
        {t:"pass",    label:"They must notify you fast, and liability sits with them."},
        {t:"partial", label:"You think there’s a contract somewhere."},
        {t:"fail",    label:"There is no DPA — you never signed one."}
      ],
      pass:"Liability lands where it belongs.",
      partial:"“Somewhere” is not where you want the liability to be.",
      fail:"No Data Processing Agreement means the vendor’s breach defaults back to you. Their practices are your practices." },

    { code:"12", name:"Incident Response Plan", pillar:"Governance", weight:7, autoFail:false, exposure:60000,
      scene:"It’s 9 p.m. You learn customer data leaked two hours ago.",
      prompt:"Your plan is…",
      opts:[
        {t:"pass",    label:"A written runbook: who, what, and notify without unreasonable delay."},
        {t:"partial", label:"You’ll “figure it out” and call someone."},
        {t:"fail",    label:"There is no plan. You freeze."}
      ],
      pass:"A contained problem instead of a headline.",
      partial:"Improvising at 9 p.m. is how the delay becomes unreasonable.",
      fail:"Nevada requires notice without unreasonable delay (NRS 603A.220). No plan is how a bad night becomes a bad year." },

    { code:"13", name:"Bias & Fairness Review", pillar:"Guardrails", weight:5, autoFail:false, exposure:20000,
      scene:"Your AI decides which leads get a callback first and which ones wait.",
      prompt:"It’s been checked for bias…",
      opts:[
        {t:"pass",    label:"Yes — a documented fairness review is on file."},
        {t:"partial", label:"“It doesn’t apply to us, we’re not hiring.”"},
        {t:"fail",    label:"Never crossed your mind."}
      ],
      pass:"A documented review beats a hopeful guess.",
      partial:"Any AI that ranks people carries this exposure — hiring or not.",
      fail:"An AI that scores, ranks, or filters people carries fair-treatment exposure. “Didn’t think about it” is not a defense." },

    { code:"14", name:"Audit Trail & Logs", pillar:"Governance", weight:8, autoFail:true, exposure:35000,
      scene:"An auditor asks: “Show me the log proving you disclosed, got consent, and honored opt-outs.”",
      prompt:"You can produce…",
      opts:[
        {t:"pass",    label:"A complete, timestamped log for every interaction."},
        {t:"partial", label:"Some records, with gaps."},
        {t:"fail",    label:"Nothing. There are no logs."}
      ],
      pass:"Proof. This is what backs up all the others.",
      partial:"Gaps in the log are gaps in every other control you passed.",
      fail:"No logs means no proof — every other control you passed becomes unprovable. That’s why it’s an auto-fail." },

    { code:"15", name:"Annual Compliance Review", pillar:"Governance", weight:4, autoFail:false, exposure:12000,
      scene:"The setup you made airtight last January hasn’t been looked at since.",
      prompt:"Your review cadence is…",
      opts:[
        {t:"pass",    label:"Scheduled and documented every year."},
        {t:"partial", label:"“Whenever we get around to it.”"},
        {t:"fail",    label:"Never — set it and forget it."}
      ],
      pass:"That’s what keeps the other fifteen from going stale.",
      partial:"“Get around to it” is how compliant-on-launch drifts to exposed.",
      fail:"Laws move, vendors change terms, scope creeps. Compliant in January is exposed by summer without a review." },

    { code:"16", name:"Insurance (E&O / GL for AI)", pillar:"Governance", weight:4, autoFail:false, exposure:55000,
      scene:"A TCPA claim lands. You call your insurer.",
      prompt:"Your policy…",
      opts:[
        {t:"pass",    label:"You’ve confirmed E&O / GL covers an AI-driven claim."},
        {t:"partial", label:"You assume it’s covered — you never asked."},
        {t:"fail",    label:"Points to an exclusion for AI and automated dialing."}
      ],
      pass:"Coverage where you’re most exposed.",
      partial:"“Probably covered” is a sentence insurers love and you’ll regret.",
      fail:"Most policies predate AI agents and carve these claims out. If you haven’t asked your broker directly, assume the answer is no." }
  ];

  var PILLARS = ["Disclosure","Outbound","Privacy","Guardrails","Governance"];
  var TIER_FACTOR = { pass:1, partial:0.5, fail:0 };
  var TIER_KLABEL = { pass:"Locked down", partial:"Winging it", fail:"Exposed" };

  /* -------- state -------- */
  var idx = 0, earned = 0, liability = 0, answered = false;
  var results = []; // {code,name,pillar,weight,autoFail,tier}
  var MAX = THREATS.reduce(function (s, t) { return s + t.weight; }, 0); // 100

  var stage = document.getElementById("stage");
  var hud = document.getElementById("hud");
  var elThreat = document.getElementById("hThreat");
  var elBand = document.getElementById("hBand");
  var elMeter = document.getElementById("hMeter");
  var elLiab = document.getElementById("hLiab");

  var fmt = function (n) { return "$" + Math.round(n).toLocaleString("en-US"); };

  function currentScore() { return Math.round((earned / MAX) * 100); }

  function updateHud() {
    var sc = currentScore();
    elThreat.textContent = String(idx + 1).padStart(2, "0");
    elMeter.style.width = sc + "%";
    elBand.textContent = bandFor(sc).label;
    elLiab.textContent = fmt(liability);
  }

  /* -------- screens -------- */
  function intro() {
    hud.classList.add("hide"); hud.setAttribute("aria-hidden", "true");
    stage.innerHTML =
      '<div class="card">' +
        '<div class="eyebrow">The Grandeza Scan · 3 minutes</div>' +
        '<h1>Your AI is answering the phones.<br><span class="u">Can it survive an audit?</span></h1>' +
        '<p class="lede">Sixteen threats are about to walk through the door — a subpoena, a “STOP” text, a gas-leak call. One question each. Answer how your shop <em>actually</em> runs today, not how you wish it did.</p>' +
        '<div class="facts">' +
          '<span class="fact">Most first-timers score <b>31–58</b></span>' +
          '<span class="fact"><b>4</b> threats are instant red flags</span>' +
          '<span class="fact">Real fines, real statutes</span>' +
        '</div>' +
        '<div class="cta-row">' +
          '<button class="btn btn-primary" id="startBtn" type="button">Start the audit →</button>' +
        '</div>' +
        '<p class="mini">No sign-up. Nothing leaves your browser. Keyboard: press 1–3 to answer.</p>' +
      '</div>';
    document.getElementById("startBtn").addEventListener("click", begin);
  }

  function begin() {
    idx = 0; earned = 0; liability = 0; results = [];
    hud.classList.remove("hide"); hud.setAttribute("aria-hidden", "false");
    updateHud();
    renderThreat();
  }

  function dotsHtml() {
    var h = '<div class="dots" aria-hidden="true">';
    for (var i = 0; i < THREATS.length; i++) {
      var cls = "dot";
      if (results[i]) { cls += " " + results[i].tier; if (THREATS[i].autoFail && results[i].tier === "fail") cls += " autofail"; }
      if (i === idx && !answered) cls += " cur";
      h += '<span class="' + cls + '"></span>';
    }
    return h + '</div>';
  }

  function renderThreat() {
    answered = false;
    var t = THREATS[idx];
    var flag = t.autoFail ? '<span class="pill pill-flag">Auto-fail</span>' : '';
    var opts = t.opts.map(function (o, i) {
      return '<button class="opt" type="button" data-i="' + i + '" data-tier="' + o.t + '">' +
               '<span class="key">' + (i + 1) + '</span>' +
               '<span class="lbl">' + o.label + '</span>' +
               '<span class="tag"></span>' +
             '</button>';
    }).join("");

    stage.innerHTML =
      '<div class="card">' +
        '<div class="sc-head">' +
          '<span class="pill pill-code">Ctrl ' + t.code + '</span>' +
          '<span class="pill pill-pillar">' + t.pillar + '</span>' +
          flag +
          '<span class="sc-name">' + t.name + '</span>' +
        '</div>' +
        '<div class="scene">' + t.scene + '</div>' +
        '<div class="prompt">' + t.prompt + '</div>' +
        '<div class="opts" id="opts">' + opts + '</div>' +
        '<div class="verdict" id="verdict">' +
          '<div class="vk" id="vk"></div>' +
          '<p id="vtext"></p>' +
          '<div class="next-row"><button class="btn btn-primary" id="nextBtn" type="button"></button></div>' +
        '</div>' +
        dotsHtml() +
      '</div>';

    var optEls = stage.querySelectorAll(".opt");
    optEls.forEach(function (el) { el.addEventListener("click", function () { choose(parseInt(el.dataset.i, 10)); }); });
    updateHud();
  }

  function choose(i) {
    if (answered) return;
    answered = true;
    var t = THREATS[idx];
    var opt = t.opts[i];
    var tier = opt.t;

    earned += t.weight * TIER_FACTOR[tier];
    if (tier === "fail") liability += t.exposure;
    else if (tier === "partial") liability += Math.round(t.exposure * 0.38);
    results[idx] = { code: t.code, name: t.name, pillar: t.pillar, weight: t.weight, autoFail: t.autoFail, tier: tier };

    // lock buttons + colorize
    var optEls = stage.querySelectorAll(".opt");
    optEls.forEach(function (el) {
      var et = el.dataset.tier;
      el.disabled = true;
      if (parseInt(el.dataset.i, 10) === i) {
        el.classList.add("is-" + et);
        el.querySelector(".tag").textContent = TIER_KLABEL[et];
      } else {
        el.classList.add("dim");
      }
    });

    updateHud();

    var isRedFlag = (tier === "fail" && t.autoFail);
    if (isRedFlag) {
      shakeScreen();
      showFlag(t);
    } else {
      showVerdict(t, tier);
    }
  }

  function showVerdict(t, tier) {
    var v = document.getElementById("verdict");
    v.className = "verdict show " + tier;
    document.getElementById("vk").textContent =
      tier === "pass" ? "Locked down — +" + t.weight + " defensibility"
      : tier === "partial" ? "Winging it — +" + (t.weight * 0.5) + " defensibility, exposure rising"
      : "Exposed — 0 defensibility";
    document.getElementById("vtext").textContent = t[tier];
    var nb = document.getElementById("nextBtn");
    var last = (idx === THREATS.length - 1);
    nb.textContent = last ? "See your verdict →" : "Next threat →";
    nb.addEventListener("click", advance);
    nb.focus();
  }

  /* red flag interstitial */
  var flash = document.getElementById("flash");
  function showFlag(t) {
    document.getElementById("flashTitle").textContent = "Control " + t.code + " — " + t.name;
    document.getElementById("flashBody").textContent = t.fail;
    flash.classList.add("show");
    var fb = document.getElementById("flashNext");
    fb.textContent = (idx === THREATS.length - 1) ? "See your verdict →" : "Brace for the next one →";
    fb.focus();
  }
  document.getElementById("flashNext").addEventListener("click", function () {
    flash.classList.remove("show");
    // still show the inline verdict briefly? Go straight on.
    advance();
  });

  function advance() {
    if (idx >= THREATS.length - 1) { renderResult(); return; }
    idx++;
    renderThreat();
  }

  function shakeScreen() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var w = document.querySelector(".wrap");
    w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake");
  }

  /* -------- results -------- */
  function renderResult() {
    hud.classList.add("hide"); hud.setAttribute("aria-hidden", "true");
    var score = currentScore();
    var band = bandFor(score);
    var failedAutos = results.filter(function (r) { return r.autoFail && r.tier === "fail"; });
    var flagged = failedAutos.length > 0;

    // effective verdict: an auto-fail caps you at "Exposed" language regardless of score
    var ringColor = flagged ? "var(--crit)" : (score >= 76 ? "var(--pass)" : score >= 51 ? "var(--gold)" : "var(--warn)");
    var shownBandName = flagged ? "Red-Flagged" : band.label;
    var shownBandDesc = flagged
      ? "You scored " + score + "/100, but a failed auto-fail control flags the whole result red — regardless of total. Fix these first."
      : band.desc;

    // pillar breakdown
    var pill = {};
    PILLARS.forEach(function (p) { pill[p] = { e: 0, m: 0 }; });
    results.forEach(function (r) { pill[r.pillar].e += r.weight * TIER_FACTOR[r.tier]; pill[r.pillar].m += r.weight; });
    var pillHtml = PILLARS.map(function (p) {
      var pct = pill[p].m ? Math.round((pill[p].e / pill[p].m) * 100) : 0;
      return '<div class="prow"><span class="pn">' + p + '</span>' +
             '<span class="pt"><span class="pf" style="width:' + pct + '%"></span></span>' +
             '<span class="pv">' + pct + '%</span></div>';
    }).join("");

    // weakest controls (failed first, then partial), heaviest weight first
    var weak = results.filter(function (r) { return r.tier !== "pass"; })
      .sort(function (a, b) {
        var rank = { fail: 0, partial: 1 };
        if (rank[a.tier] !== rank[b.tier]) return rank[a.tier] - rank[b.tier];
        return b.weight - a.weight;
      }).slice(0, 5);
    var weakHtml = weak.length
      ? '<div class="weak"><h3>Fix these first</h3><ul>' + weak.map(function (r) {
          return '<li><span class="c">' + r.code + '</span><span>' + r.name +
                 (r.autoFail && r.tier === "fail" ? " — auto-fail" : (r.tier === "fail" ? " — exposed" : " — partial")) +
                 '</span></li>';
        }).join("") + '</ul></div>'
      : '<div class="weak"><h3>Fix these first</h3><ul><li><span>Nothing failed. Keep it maintained — that’s Control 15.</span></li></ul></div>';

    var redHtml = flagged
      ? '<div class="redbar show"><div class="rk">⚠ ' + failedAutos.length + ' auto-fail control' + (failedAutos.length > 1 ? "s" : "") + ' failed</div><ul>' +
        failedAutos.map(function (r) { return '<li><b>Ctrl ' + r.code + '</b> — ' + r.name + '</li>'; }).join("") +
        '</ul></div>'
      : '';

    stage.innerHTML =
      '<div class="card">' +
        '<div class="eyebrow">Audit complete</div>' +
        '<div class="result-top" style="margin-top:14px">' +
          '<div class="ring" style="--p:' + score + ';--c:' + ringColor + '"><span class="num">' + score + '</span><span class="den">/ 100</span></div>' +
          '<div class="verdict-band">' +
            '<div class="eyebrow">Your standing</div>' +
            '<div class="band-name" style="color:' + ringColor + '">' + shownBandName + '</div>' +
            '<div class="band-desc">' + shownBandDesc + '</div>' +
          '</div>' +
        '</div>' +
        redHtml +
        '<div class="liab-line"><div class="k">Estimated liability exposure you clicked past</div><div class="v">' + fmt(liability) + '</div></div>' +
        '<div class="pillars"><h3>By pillar</h3>' + pillHtml + '</div>' +
        weakHtml +
        '<div class="cta-row">' +
          '<a class="btn btn-primary" href="https://grandeza.io/scan" target="_blank" rel="noopener">Get the real scan →</a>' +
          '<button class="btn btn-ghost" id="againBtn" type="button">Play again</button>' +
        '</div>' +
        '<p class="disclaimer">This is an educational self-assessment, not legal advice. Statutory figures shown (TCPA $500–$1,500/text; NRS 200.620 / 193.130 recording penalties; NRS 603A breach duties; FTC § 5) are real and verifiable; the running “exposure” total is an illustrative dramatization of what these gaps can cost, not a quote. Get a one-time attorney review before you rely on any of it. The real 16-control scan lives at <a href="https://grandeza.io/scan" target="_blank" rel="noopener">grandeza.io/scan</a>.</p>' +
      '</div>';

    document.getElementById("againBtn").addEventListener("click", intro);
    // animate the ring fill from 0
    var ring = stage.querySelector(".ring");
    ring.style.setProperty("--p", 0);
    requestAnimationFrame(function () { requestAnimationFrame(function () { ring.style.transition = "background .9s ease"; ring.style.setProperty("--p", score); }); });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* -------- keyboard -------- */
  document.addEventListener("keydown", function (e) {
    if (flash.classList.contains("show")) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); document.getElementById("flashNext").click(); }
      return;
    }
    if (!answered) {
      if (e.key === "1" || e.key === "2" || e.key === "3") {
        var el = stage.querySelector('.opt[data-i="' + (parseInt(e.key, 10) - 1) + '"]');
        if (el) { e.preventDefault(); choose(parseInt(el.dataset.i, 10)); }
      }
    } else {
      var nb = document.getElementById("nextBtn");
      if (nb && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); nb.click(); }
    }
  });

  intro();
})();
</script>
